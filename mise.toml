[env]
MISE_USE_VERSIONS_HOST = "0"

[tools]
actionlint = "latest"
hk = "latest"
# mise runs plugins on Lua 5.1
lua = "5.1"
lua-language-server = "latest"
pkl = "latest"
stylua = "latest"

[tasks.format]
description = "Format Lua scripts"
run = "stylua metadata.lua hooks/ lib/ test/"

[tasks.lint]
description = "Lint Lua scripts and GitHub Actions using hk"
run = "hk check"

[tasks.lint-fix]
description = "Fix linting issues"
run = "hk fix"

[tasks."test:unit"]
description = "Unit-test the helpers in lib/ with plain Lua"
run = "lua test/distrobox_test.lua"

[tasks.ci]
description = "Run all CI checks"
depends = ["lint", "test:unit", "test"]

[tasks."test:e2e"]
description = "Install, run and uninstall a real tool with podman, distrobox and mise in a container"
run = [
  "podman build -t mise-distrobox-e2e -f test/e2e/Containerfile test/e2e",
  "podman run --rm --privileged -v \"$PWD:/plugin:ro\" mise-distrobox-e2e bash /plugin/test/e2e/run.sh",
]
